name: KompNazorat 2.1 Build Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout kodni yuklab olish
      uses: actions/checkout@v4

    - name: Node.js o'rnatish
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Kerakli modullarni o'rnatish
      run: npm install

    - name: Windows uchun .exe yig'ish
      run: npm run build

    - name: Tayyor .exe dasturni saqlash (Yuklab olishga chiqarish)
      uses: actions/upload-artifact@v4
      with:
        name: KompNazorat-Windows-App
        path: dist/*.exe
