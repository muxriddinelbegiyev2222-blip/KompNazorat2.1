name: Build KompNazorat 2.1 App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Repozitoriyani yuklash
      uses: actions/checkout@v4

    - name: Node.js o‘rnatish
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Bog‘liqliklarni o‘rnatish
      run: npm install

    - name: Windows EXE dasturini yaratish
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npx electron-builder --win --x64 -c.publish=never

    - name: Tayyor Windows EXE faylini yuklash
      uses: actions/upload-artifact@v4
      with:
        name: KompNazorat-2.1-Windows-Setup
        path: dist/*.exe
